<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="">
  <link rel="canonical" href="https://microfilm.browserbox.io/">

  <meta property="og:type" content="website">

  <meta property="og:image" content="">

  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="">

  <meta property="twitter:image" content="">

  <meta name="theme-color" content="#2563eb">
  <script id="schema-software" type="application/ld+json"></script>

  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="manifest" href="./site.webmanifest">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <nav class="top-nav">
    <div class="container nav-container">
      <a class="brand" href="./">
        <img id="brand-mark" class="brand-mark" src="./assets/branding/microfilm-mark-256.png" alt="" width="40" height="40">
        <span id="brand-name"></span>
      </a>
      <div id="nav-links" class="nav-links"></div>
    </div>
  </nav>

  <header class="hero">
    <div class="container narrow">
      <p id="hero-eyebrow" class="hero-eyebrow"></p>
      <h1 id="hero-title" class="hero-title"></h1>
      <p id="hero-subtitle" class="hero-subtitle"></p>
      <p id="hero-description" class="hero-description"></p>
      <div class="hero-ctas">
        <a id="hero-primary-cta" class="button primary" href="#"></a>
        <a id="hero-secondary-cta" class="button secondary" href="#"></a>
      </div>
      <div id="hero-proof" class="hero-proof"></div>
      <div class="scrubber-demo" aria-hidden="true">
        <div class="scrubber-frames">
          <div class="frame"></div>
          <div class="frame"></div>
          <div class="frame"></div>
          <div class="frame"></div>
          <div class="frame"></div>
          <div class="frame"></div>
          <div class="frame"></div>
          <div class="frame"></div>
          <div class="frame"></div>
          <div class="frame"></div>
          <div class="frame"></div>
          <div class="frame"></div>
        </div>
        <div class="scrubber-playhead"></div>
      </div>
    </div>
  </header>

  <section class="section muted">
    <div class="container narrow text-center">
      <p id="promise-lead" class="lead-text"></p>
    </div>
  </section>

  <section id="demos" class="section">
    <div class="container">
      <p id="demos-kicker" class="section-kicker"></p>
      <h2 id="demos-title" class="section-title"></h2>
      <p id="demos-subtitle" class="section-subtitle"></p>
      <div id="demo-container" class="demo-grid"></div>
    </div>
  </section>

  <section class="section muted">
    <div class="container">
      <h2 id="flow-title" class="section-title"></h2>
      <div id="flow-container" class="flow-grid"></div>
    </div>
  </section>

  <section id="pricing" class="section">
    <div class="container">
      <h2 id="pricing-title" class="section-title"></h2>
      <p id="pricing-subtitle" class="section-subtitle"></p>
      <div id="pricing-container" class="pricing-grid"></div>
    </div>
  </section>

  <section class="section muted">
    <div class="container">
      <h2 id="buyer-title" class="section-title"></h2>
      <p id="buyer-subtitle" class="section-subtitle"></p>
      <div id="buyer-container" class="buyer-grid"></div>
    </div>
  </section>

  <section id="usage" class="section">
    <div class="container">
      <h2 id="usage-title" class="section-title"></h2>
      <div id="usage-container" class="command-grid"></div>
      <p id="usage-note" class="small-text text-center mt-4"></p>
    </div>
  </section>

  <section id="install" class="section">
    <div class="container narrow">
      <div class="install-card">
        <h2 id="install-title"></h2>
        <p id="install-description"></p>
        <div class="mt-4">
          <a id="install-primary-cta" class="button primary" href="#"></a>
        </div>
        <div id="install-commands" class="mt-4 command-list"></div>
      </div>
    </div>
  </section>

  <section id="faq" class="section muted">
    <div class="container narrow">
      <h2 id="faq-title" class="section-title"></h2>
      <div id="faq-container"></div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="container footer-content">
      <div class="footer-left">
        <a class="brand" href="./">
          <img id="footer-brand-mark" class="brand-mark" src="./assets/branding/microfilm-mark-256.png" alt="" width="40" height="40">
          <span id="footer-brand-name"></span>
        </a>
        <span id="built-by" class="built-by"></span>
      </div>
      <div id="footer-links" class="footer-links"></div>
    </div>
  </footer>

  <script type="module" src="./app.js"></script>
